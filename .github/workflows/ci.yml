name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tsconfigs (no deprecated TS7 flags)
        run: pnpm verify:tsconfigs

      - name: Typecheck (TypeScript 7)
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Build apps
        run: pnpm build
